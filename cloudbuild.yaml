# Baut eine Seite aus Firestore und veröffentlicht sie auf Cloudflare Pages.
#
# Gestartet vom Cloud-Build-Trigger der Seite (infra/gcp): bei einem Push auf
# ihren Branch und wenn jemand in der Verwaltungsseite auf Veröffentlichen
# drückt (gcf/publish.js). Der Trigger setzt alle Substitutionen unten; die Titel
# kommen aus dem Firestore-Dokument der Künstler:in. Läuft als
# werkverzeichnis-build@, das Firestore und die Bucket-Liste liest; das
# Cloudflare-Token kommt aus dem Secret Manager.
options:
  # Pflicht bei einem selbst gewählten Servicekonto.
  logging: CLOUD_LOGGING_ONLY
  # Eine Substitution, die der Trigger nicht setzt, lässt den Build scheitern, statt leer zu bleiben.
  substitution_option: MUST_MATCH

steps:
  - id: install
    name: node:24
    entrypoint: bash
    args: [-c, 'command -v yarn >/dev/null || npm install -g yarn@1; yarn install --frozen-lockfile --non-interactive']

  - id: build
    name: node:24
    entrypoint: bash
    args: [-c, 'command -v yarn >/dev/null || npm install -g yarn@1; yarn build']
    env:
      - SITE=${_SITE}
      - FIRESTORE_PROJECT=$PROJECT_ID
      - FIRESTORE_DATABASE=${_FIRESTORE_DATABASE}
      - ARTIST_ID=${_ARTIST}
      - STRICT=1

  - id: deploy
    name: node:24
    entrypoint: bash
    args:
      - -c
      - >-
        npx wrangler pages deploy dist
        --project-name=${_PAGES_PROJECT} --branch=$BRANCH_NAME
        --commit-hash=$COMMIT_SHA --commit-message="Cloud Build $BUILD_ID"
    env:
      - CLOUDFLARE_ACCOUNT_ID=${_CLOUDFLARE_ACCOUNT_ID}
    secretEnv: [CLOUDFLARE_API_TOKEN]

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/cloudflare-pages-token/versions/latest
      env: CLOUDFLARE_API_TOKEN

timeout: 1200s
