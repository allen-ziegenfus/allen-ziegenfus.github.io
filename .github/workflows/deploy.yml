name: Deploy Site to GitHub Pages

on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * 1'   # Mondays 00:00 UTC
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# id-token: write is what lets the job request an OIDC token, which is what makes
# the Google side keyless. contents/pages are for the deployment itself.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    env:
      SITE: ${{ vars.SITE }}
      WEBSITE_TITLE: ${{ vars.WEBSITE_TITLE }}
      WEBSITE_TITLE_MOBILE_LINE_1: ${{ vars.WEBSITE_TITLE_MOBILE_LINE_1 }}
      WEBSITE_TITLE_MOBILE_LINE_2: ${{ vars.WEBSITE_TITLE_MOBILE_LINE_2 }}
      COPYRIGHT_AUTHOR: ${{ vars.COPYRIGHT_AUTHOR }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      # The editor at /bearbeiten/ runs in the browser, which only sees PUBLIC_ vars.
      PUBLIC_SHEET_ID: ${{ vars.SHEET_ID }}
      PUBLIC_DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      PUBLIC_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      # Bad data should fail the build rather than publish a gap.
      STRICT: '1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v5

      # Drive originals and the converted images, so a run only fetches and
      # converts what changed. Saved even when the build fails, so its downloads
      # are not lost. GitHub drops a cache unused for 7 days, so the first run
      # after a quiet week starts cold — a few minutes, downloads run in parallel.
      - name: Restore image cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/originals
            public/images
          key: images-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: images-${{ github.ref_name }}-

      # Exchanges the job's OIDC token for a short-lived Google access token and
      # writes it where GoogleAuth will find it. Nothing long-lived is stored.
      # The provider must pin attribute.repository to this repo — see the runbook.
      - name: Authenticate to Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/repo
          service_account: ${{ vars.SA }}

      - name: Install, build, and upload your site
        uses: withastro/action@v4
        with:
          path: .
          node-version: 20
          package-manager: yarn

      - name: Save image cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/originals
            public/images
          key: images-${{ github.ref_name }}-${{ github.run_id }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
