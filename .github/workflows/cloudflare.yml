name: Deploy to Cloudflare Pages

# Manual only, and it builds whatever branch you pick. The workflow file lives on
# the default branch so it appears in the Actions tab; `source_ref` decides what
# actually gets built, so a branch can be deployed without merging it first.
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch to build from
        required: true
        default: sheets-build
      site:
        description: Public URL of this deployment (blank = the SITE variable)
        required: false
        default: ''

permissions:
  contents: read
  id-token: write          # required for the keyless Google auth below

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SITE: ${{ inputs.site || vars.SITE }}
      WEBSITE_TITLE: ${{ vars.WEBSITE_TITLE }}
      WEBSITE_TITLE_MOBILE_LINE_1: ${{ vars.WEBSITE_TITLE_MOBILE_LINE_1 }}
      WEBSITE_TITLE_MOBILE_LINE_2: ${{ vars.WEBSITE_TITLE_MOBILE_LINE_2 }}
      COPYRIGHT_AUTHOR: ${{ vars.COPYRIGHT_AUTHOR }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      # The editor at /bearbeiten/ runs in the browser, which only sees PUBLIC_ vars.
      PUBLIC_SHEET_ID: ${{ vars.SHEET_ID }}
      PUBLIC_DRIVE_FOLDER_ID: ${{ vars.DRIVE_FOLDER_ID }}
      PUBLIC_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
      STRICT: '1'
      # Only the firestore-build branch reads these; elsewhere they are unused.
      FIRESTORE_PROJECT: vollrad-werkverzeichnis
      FIRESTORE_DATABASE: werkverzeichnis
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref }}

      # Drive originals and the converted images, so a run only fetches and
      # converts what changed. Saved even when the build fails, so its downloads
      # are not lost. GitHub drops a cache unused for 7 days, so the first run
      # after a quiet week starts cold — a few minutes, downloads run in parallel.
      - name: Restore image cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/originals
            public/images
          key: images-${{ inputs.source_ref }}-${{ github.run_id }}
          restore-keys: images-${{ inputs.source_ref }}-

      # Exchanges this job's OIDC token for a short-lived Google access token.
      # Nothing long-lived is stored; the provider is pinned to this repository.
      - name: Authenticate to Google
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/${{ vars.PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github/providers/repo
          service_account: ${{ vars.SA }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile

      # Reads the Sheet and Drive, then renders to dist/.
      - run: yarn build

      - name: Save image cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/originals
            public/images
          key: images-${{ inputs.source_ref }}-${{ github.run_id }}

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT_NAME }}
            --branch=${{ inputs.source_ref }}
